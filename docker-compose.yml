version: '3.8'

services:
  backend:
    build: ./backend
    container_name: reorder_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./reorder.db
    volumes:
      - ./backend/reorder.db:/app/reorder.db

  frontend:
    build: ./frontend
    container_name: reorder_frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api
    depends_on:
      - backend
